<!doctype html>
<html lang="tr" data-theme="charcoal-light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			try {
				var v = localStorage.getItem('hf_theme_variant') || 'charcoal';
				var m = localStorage.getItem('hf_theme_mode')    || 'system';
				var resolved = m === 'system'
					? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
					: m;
				document.documentElement.setAttribute('data-theme', v + '-' + resolved);
			} catch(e) {}
		</script>

		<!-- Site geneli OG önizleme -->
		<meta name="description"          content="Kürt edebiyatı, dil öğrenme ve kültür platformu" />
		<meta property="og:site_name"     content="Heftreng" />
		<meta property="og:title"         content="Heftreng — Kürt Edebiyatı ve Dil Öğrenme" />
		<meta property="og:description"   content="Kürt edebiyatı, dil öğrenme ve kültür platformu" />
		<meta property="og:image"         content="https://heftreng.onrender.com/og-default.png" />
		<meta property="og:url"           content="https://heftreng.onrender.com" />
		<meta property="og:type"          content="website" />
		<meta name="twitter:card"         content="summary_large_image" />
		<meta name="twitter:title"        content="Heftreng — Kürt Edebiyatı ve Dil Öğrenme" />
		<meta name="twitter:description"  content="Kürt edebiyatı, dil öğrenme ve kültür platformu" />
		<meta name="twitter:image"        content="https://heftreng.onrender.com/og-default.png" />

		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
