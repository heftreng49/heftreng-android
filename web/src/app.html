<!doctype html>
<html lang="ku" data-theme="charcoal-light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			try {
				var v = localStorage.getItem('hf_theme_variant') || 'charcoal';
				var m = localStorage.getItem('hf_theme_mode')    || 'system';
				var resolved = m === 'system'
					? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
					: m;
				document.documentElement.setAttribute('data-theme', v + '-' + resolved);
			} catch(e) {}
		</script>

		<!-- PWA -->
		<link rel="manifest" href="/manifest.json" />
		<meta name="theme-color" content="#c9a84c" />

		<!-- iOS PWA — Ana Ekrana Ekle desteği -->
		<meta name="apple-mobile-web-app-capable"          content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title"            content="Heftreng" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		<!--
			OG önizleme — SADECE değişmeyen alanlar burada kalır.
			og:title, og:description, og:image, og:url gibi sayfa-özel etiketler
			KALDIRILDI — her route kendi <svelte:head> içinde bunları set eder
			(post/[id], blog/[id], profile/[uid], kütüphane sayfaları vb.).
			Eskiden burada sabit değerler vardı; bazı paylaşım botları (WhatsApp,
			Facebook) sayfayı tam render etmeden bu statik etiketleri okuyup
			hangi içerik paylaşılırsa paylaşılsın hep aynı önizlemeyi gösteriyordu.
		-->
		<meta name="description"      content="Platforma edebiyat, fêrbûn û çanda Kurdî" />
		<meta property="og:site_name" content="Heftreng" />
		<meta property="og:type"      content="website" />
		<meta name="twitter:card"     content="summary_large_image" />

		<!-- Ana sayfa varsayılanı — route kendi <svelte:head>'i yoksa buraya düşer -->
		<meta property="og:title"       content="Heftreng — Edebiyata Kurdî û Fêrbûna Ziman" />
		<meta property="og:description" content="Platforma edebiyat, fêrbûn û çanda Kurdî" />
		<meta property="og:image"       content="https://heftreng.onrender.com/og-default.png" />
		<meta property="og:url"         content="https://heftreng.onrender.com" />
		<meta name="twitter:image"      content="https://heftreng.onrender.com/og-default.png" />

		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', () => {
					navigator.serviceWorker.register('/sw.js').catch(() => {});
				});
			}
		</script>
	</body>
</html>
