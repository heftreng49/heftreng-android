<!doctype html>
<html lang="tr" data-theme="charcoal-light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Tema FOUC önleme: JS yüklenmeden önce doğru data-theme'i uygula -->
		<script>
			try {
				var v = localStorage.getItem('hf_theme_variant') || 'charcoal';
				var m = localStorage.getItem('hf_theme_mode')    || 'system';
				var resolved = m === 'system'
					? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
					: m;
				document.documentElement.setAttribute('data-theme', v + '-' + resolved);
			} catch(e) {}
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
