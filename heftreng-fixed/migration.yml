name: Migrate Library Quotes

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (değişiklik yapma, sadece say)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase Admin
        run: npm install firebase-admin

      - name: Run Migration
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node - << 'JSEOF'

const admin = require('firebase-admin');

const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
admin.initializeApp({ credential: admin.credential.cert(sa) });
const db = admin.firestore();
const DRY = process.env.DRY_RUN === 'true';

console.log(`\n🚀 Heftreng Library Quote Migration — DRY_RUN=${DRY}\n`);

async function migrate() {
  let checked = 0, fixed = 0, skipped = 0, errors = 0;

  // ── 1. Feed koleksiyonundaki tüm alıntıları tara ─────────────────────────
  console.log('📂 feed koleksiyonu taranıyor...');
  const feedSnap = await db.collection('feed').get();
  const batch1 = db.batch();
  let batch1Count = 0;

  for (const doc of feedSnap.docs) {
    const d = doc.data();
    checked++;

    const quoteObj   = d.quote || {};
    const quoteText  = (quoteObj.text || d.quoteText || '').trim();
    const bookName   = (quoteObj.book || d.bookName  || '').trim();
    const authorName = (quoteObj.author || d.authorName || '').trim();

    // Alıntı değil — atla
    if (!quoteText && !bookName && !authorName) { skipped++; continue; }

    const updates = {};

    // type eksikse ekle
    if (!d.type && quoteText) updates.type = 'library_quote';

    // flat alanlar eksikse tamamla
    if (!d.quoteText && quoteText)   updates.quoteText  = quoteText;
    if (!d.bookName  && bookName)    updates.bookName   = bookName;
    if (!d.authorName && authorName) updates.authorName = authorName;

    // visibility yoksa public olarak işaretle
    if (!d.visibility) updates.visibility = 'public';

    if (Object.keys(updates).length === 0) { skipped++; continue; }

    console.log(`  ✏️  ${doc.id} → ${JSON.stringify(updates)}`);

    if (!DRY) {
      batch1.update(doc.ref, updates);
      batch1Count++;
      if (batch1Count >= 400) {
        await batch1.commit();
        console.log('  💾 Batch committed (400)');
        batch1Count = 0;
      }
    }
    fixed++;
  }

  if (!DRY && batch1Count > 0) {
    await batch1.commit();
    console.log(`  💾 Batch committed (${batch1Count})`);
  }

  // ── 2. library_books/{id}/quotes alt koleksiyonlarını kontrol et ──────────
  console.log('\n📚 library_books/quotes taranıyor...');
  const cgSnap = await db.collectionGroup('quotes').get();
  const batch2 = db.batch();
  let batch2Count = 0;

  for (const doc of cgSnap.docs) {
    const d = doc.data();
    const updates2 = {};

    // feedPostId varsa feed belgesiyle bağlantılı — kontrol et
    if (!d.feedPostId) {
      // feed'de eşleşen belge ara (uid + text)
      // Bu pahalı olur, sadece eksik alanları tamamla
    }

    // bookTitle → bookName standardize
    if (!d.bookName && d.bookTitle) updates2.bookName = d.bookTitle;
    // userDisplayName → displayName
    if (!d.displayName && d.userDisplayName) updates2.displayName = d.userDisplayName;

    if (Object.keys(updates2).length === 0) continue;

    console.log(`  ✏️  quotes/${doc.id} → ${JSON.stringify(updates2)}`);

    if (!DRY) {
      batch2.update(doc.ref, updates2);
      batch2Count++;
      if (batch2Count >= 400) {
        await batch2.commit();
        batch2Count = 0;
      }
    }
    fixed++;
  }

  if (!DRY && batch2Count > 0) {
    await batch2.commit();
  }

  // ── Özet ─────────────────────────────────────────────────────────────────
  console.log(`
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
✅ Migration tamamlandı
   Kontrol edilen : ${checked}
   Düzeltilen     : ${fixed}
   Atlanan        : ${skipped}
   Hata           : ${errors}
   DRY_RUN        : ${DRY}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
${DRY ? '\n⚠️  DRY RUN — gerçek değişiklik yapılmadı.\n   Dry run=false ile tekrar çalıştır.' : ''}
  `);
}

migrate().catch(e => { console.error('❌ Migration hatası:', e); process.exit(1); });
JSEOF
