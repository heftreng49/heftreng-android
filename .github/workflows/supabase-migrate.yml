name: Supabase — Firestore Verisini Taşı

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (sadece say, yazma)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bağımlılıkları yükle
        working-directory: scripts
        run: npm install

      - name: Veriyi Supabase'e taşı
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:     ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN:                  ${{ github.event.inputs.dry_run }}
        run: node migrate_to_supabase.js

      - name: Mevcut kullanıcıları Supabase users tablosuna taşı
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:     ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN:                  ${{ github.event.inputs.dry_run }}
        run: node migrate_users_to_supabase.js

      - name: Like/Save sayaçlarını senkronize et
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:     ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN:                  ${{ github.event.inputs.dry_run }}
        run: node sync_counts.js
