name: Supabase — Firestore Verisini Taşı

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (sadece say, yazma)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bağımlılıkları yükle
        run: npm install postgres firebase-admin

      - name: Tabloları oluştur (schema)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          node - << 'JSEOF'
          const postgres = require('postgres');
          const fs = require('fs');
          const schema = fs.readFileSync('scripts/supabase_schema.sql', 'utf8');
          (async () => {
            const sql = postgres(process.env.SUPABASE_DB_URL, {
              ssl: { rejectUnauthorized: false },
              connect_timeout: 30,
              max: 1,
            });
            try {
              const stmts = schema.split(';')
                .map(s => s.trim())
                .filter(s => s.length > 2 && !s.startsWith('--'));
              for (const stmt of stmts) {
                try {
                  await sql.unsafe(stmt + ';');
                } catch(e) {
                  if (!e.message?.includes('already exists')) {
                    console.warn('⚠️ ', e.message?.slice(0, 120));
                  }
                }
              }
              console.log('✅ Tablolar hazır');
            } finally {
              await sql.end();
            }
          })();
          JSEOF

      - name: PostgREST cache reload bekle
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "⏳ PostgREST schema cache yenileniyor (15 sn)..."
          sleep 15
          # Cache reload tetikle
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" || true
          echo " ✅ Hazır"

      - name: Migration script'i çalıştır
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:     ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN:                  ${{ github.event.inputs.dry_run }}
        run: node scripts/migrate_to_supabase.js
