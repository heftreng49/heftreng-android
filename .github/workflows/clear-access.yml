name: Clear Cloudflare Access App

on:
  workflow_dispatch:

jobs:
  delete-app:
    runs-on: ubuntu-latest
    steps:
      - name: List and Delete Access App
        env:
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          CF_KEY: ${{ secrets.CF_GLOBAL_KEY }}
        run: |
          ACCOUNT_ID="6224f4246a7ec6aeea0e64727cbfddab"
          
          echo "1. Cloudflare üzerindeki kilitli uygulamalar listeleniyor..."
          RESPONSE=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/access/apps" \
               -H "X-Auth-Email: $CF_EMAIL" \
               -H "X-Auth-Key: $CF_KEY" \
               -H "Content-Type: application/json")
          
          echo "Gelen Yanıt: $RESPONSE"
          
          APP_ID=$(echo $RESPONSE | jq -r '.result[0].id // empty')
          
          if [ -n "$APP_ID" ] && [ "$APP_ID" != "null" ]; then
            echo "Bulunan App ID: $APP_ID. Silme işlemi başlatılıyor..."
            DELETE_RESP=$(curl -s -X DELETE "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/access/apps/$APP_ID" \
                 -H "X-Auth-Email: $CF_EMAIL" \
                 -H "X-Auth-Key: $CF_KEY" \
                 -H "Content-Type: application/json")
            echo "Silme Yanıtı: $DELETE_RESP"
            echo "İşlem Tamamlandı! Kilit kaldırıldı."
          else
            echo "Silinecek kilitli uygulama bulunamadı veya kalmamış."
          fi

