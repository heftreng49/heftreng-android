name: Android Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "web/**"
  workflow_dispatch:
    inputs:
      publish_to_play:
        description: 'Play Store''a gönder mi?'
        required: true
        type: boolean
        default: false
      track:
        description: 'Play Store track (sadece publish_to_play=true ise kullanılır)'
        required: true
        type: choice
        default: 'internal'
        options:
          - internal
          - alpha
          - beta
          - production
      release_notes_tr:
        description: 'Sürüm notu — Türkçe'
        required: false
        type: string
        default: ''
      release_notes_ku:
        description: 'Sürüm notu — Kurdî'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    outputs:
      aab_path: app/build/outputs/bundle/release
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'          # setup-java'nın kendi Gradle cache'i — wrapper dahil

      # setup-gradle ile setup-java cache çakışmasın diye setup-gradle'ı kaldırıyoruz.
      # setup-java 'cache: gradle' zaten ~/.gradle/caches + wrapper/dists cache'ler.

      # Build cache (compiled output) — bağımlılıktan ayrı tutuyoruz
      - name: Cache Gradle build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/build-cache-*
          key: gradle-build-${{ runner.os }}-${{ hashFiles('**/*.kt', '**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-build-${{ runner.os }}-

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks

      - name: Write google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      # clean YOK — incremental build + build cache aktif
      # assembleRelease + bundleRelease tek seferde: Kotlin sadece 1 kez derlenir
      - name: Build Release APK + AAB
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: ./gradlew assembleRelease bundleRelease --build-cache --parallel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: heftreng-release.apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: heftreng-release.aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload Native Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: heftreng-native-symbols
          path: app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          if-no-files-found: ignore

  publish:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_play == true }}
    runs-on: ubuntu-22.04
    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: heftreng-release.aab
          path: aab/

      - name: Download Native Debug Symbols
        uses: actions/download-artifact@v4
        with:
          name: heftreng-native-symbols
          path: symbols/
        continue-on-error: true

      - name: Write release notes
        run: |
          mkdir -p release-notes
          echo "${{ inputs.release_notes_tr }}" > release-notes/tr-TR.txt
          echo "${{ inputs.release_notes_ku }}" > release-notes/ku.txt

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.heftreng.app
          releaseFiles: aab/*.aab
          track: ${{ inputs.track }}
          status: completed
          whatsNewDirectory: release-notes/
