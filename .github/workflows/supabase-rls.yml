name: Supabase — RLS Kurallarını Deploy Et

# Manuel tetiklenir
# Her RLS değişikliğinde buradan çalıştır — Supabase paneline girme
on:
  workflow_dispatch:

jobs:
  deploy-rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: postgresql-client kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Mevcut policy'leri göster (öncesi)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "📋 Mevcut policy sayısı:"
          psql "$SUPABASE_DB_URL" -c "
            select tablename, count(*) as policy_count
            from pg_policies
            where schemaname = 'public'
            group by tablename
            order by tablename;
          "

      - name: Users tablo policy güncelle
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" \
            -f scripts/supabase_users_schema.sql \
            --set ON_ERROR_STOP=1
          echo "✅ users policy güncellendi"

      - name: RLS kurallarını uygula
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" \
            -f scripts/supabase_rls.sql \
            --set ON_ERROR_STOP=1
          echo "✅ RLS kuralları uygulandı"

      - name: Policy'leri doğrula (sonrası)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "📋 Yeni policy listesi:"
          psql "$SUPABASE_DB_URL" -c "
            select tablename, policyname, cmd, roles
            from pg_policies
            where schemaname = 'public'
            order by tablename, policyname;
          "
