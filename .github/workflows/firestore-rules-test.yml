name: Firestore Rules Test

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - '.github/workflows/firestore-rules-test.yml'
  pull_request:
    paths:
      - 'firestore.rules'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (emulator için)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install @firebase/rules-unit-testing firebase-admin

      - name: Write test script
        run: |
          cat > rules-test.js << 'JSEOF'
          const { initializeTestEnvironment, assertFails, assertSucceeds } = require("@firebase/rules-unit-testing");
          const fs = require("fs");

          const RULES = fs.readFileSync("firestore.rules", "utf8");

          async function runTests() {
            const env = await initializeTestEnvironment({
              projectId: "bloggerheftreng",
              firestore: { rules: RULES, host: "localhost", port: 8080 },
            });

            let passed = 0, failed = 0;
            async function test(name, fn) {
              try { await fn(); console.log("  PASS: " + name); passed++; }
              catch(e) { console.error("  FAIL: " + name + " - " + e.message); failed++; }
            }

            const anon  = env.unauthenticatedContext();
            const user1 = env.authenticatedContext("user1", { email: "user1@test.com", email_verified: true });
            const user2 = env.authenticatedContext("user2", { email: "user2@test.com", email_verified: true });

            // ── Test verilerini emülatöre yaz (Rules bypass) ─────────────────
            await env.withSecurityRulesDisabled(async (ctx) => {
              const db = ctx.firestore();
              await db.collection("users").doc("user1").set({
                uid: "user1", displayName: "User1", isPrivate: false, banned: false,
                emailVerified: true, signInMethod: "google",
              });
              await db.collection("users").doc("user2").set({
                uid: "user2", displayName: "User2", isPrivate: false, banned: false,
                emailVerified: true, signInMethod: "google",
              });
              await db.collection("feed").doc("public_post").set({
                uid: "user1", visibility: "public", text: "herkese acik",
                likesCount: 0, commentsCount: 0, repostsCount: 0,
                moderationStatus: "active", ts: null, type: "post",
              });
              await db.collection("feed").doc("private_post").set({
                uid: "user2", visibility: "only_me", text: "gizli",
                likesCount: 0, commentsCount: 0, repostsCount: 0,
                moderationStatus: "active", ts: null, type: "post",
              });
            });

            console.log("\n-- USERS --");
            await test("herkes users okuyabilir", () =>
              assertSucceeds(anon.firestore().collection("users").doc("user1").get())
            );
            await test("herkes users listeleyebilir", () =>
              assertSucceeds(anon.firestore().collection("users").get())
            );

            console.log("\n-- FEED --");
            await test("giris yapan feed listleyebilir", () =>
              assertSucceeds(user1.firestore().collection("feed").where("type","==","post").get())
            );
            await test("anonim feed listleyebilir (web icin acik)", () =>
              assertSucceeds(anon.firestore().collection("feed").get())
            );
            await test("anonim herkese acik postu okuyabilir", () =>
              assertSucceeds(anon.firestore().collection("feed").doc("public_post").get())
            );
            await test("anonim only_me postu okuyamaz", () =>
              assertFails(anon.firestore().collection("feed").doc("private_post").get())
            );
            await test("sahip only_me postunu okuyabilir", () =>
              assertSucceeds(user2.firestore().collection("feed").doc("private_post").get())
            );

            console.log("\n-- FOLLOWS --");
            await test("anonim follows okuyabilir", () =>
              assertSucceeds(anon.firestore().collection("follows").get())
            );
            await test("giris yapan kendi adina takip olusturabilir", () =>
              assertSucceeds(user1.firestore().collection("follows").doc("user1_user2").set({
                fromUid: "user1", targetUid: "user2", ts: null,
                fromName: "User1", fromPhoto: "", targetName: "User2", targetPhoto: "",
              }))
            );
            await test("baskasi adina takip olusturulamaz", () =>
              assertFails(user1.firestore().collection("follows").doc("user2_user1").set({
                fromUid: "user2", targetUid: "user1", ts: null,
                fromName: "User2", fromPhoto: "", targetName: "User1", targetPhoto: "",
              }))
            );

            console.log("\n-- LIBRARY --");
            await test("herkes library_books okuyabilir", () =>
              assertSucceeds(anon.firestore().collection("library_books").get())
            );

            console.log("\n-- FEEDLIKES --");
            await test("anonim feedLikes okuyamaz", () =>
              assertFails(anon.firestore().collection("feedLikes").get())
            );
            await test("giris yapan kendi feedLike olusturabilir", () =>
              assertSucceeds(user2.firestore().collection("feedLikes").doc("post1_user2").set({
                uid: "user2", feedId: "public_post", ts: null,
              }))
            );
            await test("baskasi adina feedLike olusturulamaz", () =>
              assertFails(user1.firestore().collection("feedLikes").doc("x_user2").set({
                uid: "user2", feedId: "public_post", ts: null,
              }))
            );

            console.log("\n-- CMS --");
            await test("herkes cms_ads okuyabilir (reklam config)", () =>
              assertSucceeds(anon.firestore().collection("cms_ads").get())
            );
            await test("herkes appConfig okuyabilir", () =>
              assertSucceeds(anon.firestore().collection("appConfig").get())
            );

            await env.cleanup();
            console.log("\nSonuc: " + passed + " gecti, " + failed + " basarisiz");
            if (failed > 0) process.exit(1);
          }

          runTests().catch(e => { console.error(e); process.exit(1); });
          JSEOF

      - name: Start Firestore emulator and run tests
        run: |
          npx --yes firebase-tools emulators:exec \
            --only firestore \
            --project bloggerheftreng \
            "node rules-test.js"
