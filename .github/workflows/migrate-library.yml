name: Migrate Library

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — sadece say, değişiklik yapma'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-admin
        run: npm install firebase-admin

      - name: Create service account file
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccount.json

      - name: Run migration
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "⚠️  DRY RUN modu — gerçek değişiklik yapılmayacak"
          else
            echo "🚀 GERÇEK migration başlıyor..."
          fi
          node migrate-library.js

      - name: Cleanup
        if: always()
        run: rm -f serviceAccount.json
