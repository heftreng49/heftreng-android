name: Firebase Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'functions/**'
      - 'public/**'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'remoteconfig.template.json'
      - '.github/workflows/deploy-firebase.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Functions dependencies
        run: |
          cd functions
          rm -rf node_modules package-lock.json
          npm install

      - name: Configure env (2nd gen functions)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: |
          printf "SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\nSUPABASE_SERVICE_KEY=%s\nBLOGGER_CLIENT_ID=%s\nBLOGGER_CLIENT_SECRET=%s\nBLOGGER_REFRESH_TOKEN=%s\nBLOGGER_BLOG_ID=%s\n" \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" "$SUPABASE_SERVICE_KEY" "$BLOGGER_CLIENT_ID" "$BLOGGER_CLIENT_SECRET" "$BLOGGER_REFRESH_TOKEN" "$BLOGGER_BLOG_ID" \
            > functions/.env.bloggerheftreng

      - name: Deploy to Firebase
        run: firebase deploy --only functions,firestore:rules,firestore:indexes,remoteconfig --force --project bloggerheftreng --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
