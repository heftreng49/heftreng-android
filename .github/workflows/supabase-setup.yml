name: Supabase — Tabloları Oluştur

# Sadece manuel tetiklenir — bir kez çalıştırman yeterli
on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: psql kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Schema SQL'i çalıştır
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -f scripts/supabase_schema.sql --set ON_ERROR_STOP=1
          psql "$SUPABASE_DB_URL" -f scripts/supabase_social_schema.sql --set ON_ERROR_STOP=1
          psql "$SUPABASE_DB_URL" -f scripts/supabase_users_schema.sql --set ON_ERROR_STOP=1
          psql "$SUPABASE_DB_URL" -f scripts/feed_comments.sql --set ON_ERROR_STOP=1
          psql "$SUPABASE_DB_URL" -f scripts/sync_user_display_info.sql --set ON_ERROR_STOP=1
          psql "$SUPABASE_DB_URL" -f scripts/add_moderation_status.sql --set ON_ERROR_STOP=1
          psql "$SUPABASE_DB_URL" -f scripts/add_author_dedup.sql --set ON_ERROR_STOP=1
          psql "$SUPABASE_DB_URL" -f scripts/add_presence_table.sql --set ON_ERROR_STOP=1
          echo "✅ Tüm tablolar oluşturuldu"
